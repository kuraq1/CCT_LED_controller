<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Panel ESP32</h1>
    <div class="slidecontainer"></div>
        <p>Status hot: <span id="hot-stat">0</span></p>
        <input type="range" min="0" max="100" value="0" class="slider" id="hotRange">
        <p>Status cold: <span id="cold-stat">0</span></p>
        <input type="range" min="0" max="100" value="0" class="slider" id="coldRange">
    </div>
    <script src="script.js"></script>
</body>
</html>
